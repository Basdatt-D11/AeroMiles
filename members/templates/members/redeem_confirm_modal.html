<div class="modal fade" id="redeemModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Konfirmasi Redeem</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Apakah Anda yakin ingin menukarkan:</p>
        <p class="fw-semibold" id="modalRewardName"></p>
        <p class="text-muted" id="modalRewardMiles"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary" id="confirmRedeemBtn">Konfirmasi</button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
    const confirmBtn = document.getElementById('confirmRedeemBtn');
    confirmBtn.addEventListener('click', function(){
        const id = this.dataset.id;
        // Untuk demo: tutup modal dan tampilkan alert. Ganti dengan panggilan fetch/ajax ke view Django.
        const modalEl = document.getElementById('redeemModal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        modal.hide();
        alert('Redeem dikonfirmasi untuk reward id: ' + id);
    });
});
</script>
