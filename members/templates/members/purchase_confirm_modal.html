<div class="modal fade" id="purchaseModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Konfirmasi Pembelian</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Anda akan membeli paket berikut:</p>
        <p class="fw-semibold" id="modalPackageId"></p>
        <p class="text-muted" id="modalPackageMiles"></p>
        <p class="text-muted" id="modalPackagePrice"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary" id="confirmPurchaseBtn">Konfirmasi Pembelian</button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
    const confirmBtn = document.getElementById('confirmPurchaseBtn');
    confirmBtn.addEventListener('click', function(){
        const id = this.dataset.id;
        const modalEl = document.getElementById('purchaseModal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        modal.hide();
        alert('Pembelian berhasil untuk paket: ' + id + '\n(Ini demo; hubungkan ke backend untuk eksekusi nyata)');
    });
});
</script>
